# Keystore and signing configuration
# DO NOT commit this file to version control
# Create your own keystore using: keytool -genkey -v -keystore lnreader-key.keystore -keyalg RSA -keysize 2048 -validity 10000

# For signing release APK:
# RELEASE_STORE_FILE=path/to/lnreader-key.keystore
# RELEASE_STORE_PASSWORD=your_keystore_password
# RELEASE_KEY_ALIAS=lnreader
# RELEASE_KEY_PASSWORD=your_key_password
